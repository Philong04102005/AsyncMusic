log_format resonance escape=json '{"time":"$time_iso8601","method":"$request_method","path":"$uri","status":$status,"duration":$request_time}';
upstream resonance_api { server api:4000; }
server {
  listen 80;
  server_name _;
  client_max_body_size 32k;
  # Do not log query strings: OAuth callbacks contain single-use authorization codes.
  access_log /var/log/nginx/access.log resonance;
  location /socket.io/ {
    proxy_pass http://resonance_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }
  location /api/ {
    proxy_pass http://resonance_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /health { proxy_pass http://resonance_api; }
  location / {
    proxy_pass http://web:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
