services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: resonance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resonance}
      POSTGRES_DB: resonance
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resonance"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: ., target: api }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://resonance:${POSTGRES_PASSWORD:-resonance}@postgres:5432/resonance
    command: ["npm", "run", "db:migrate"]
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["app"]
  api:
    build: { context: ., target: api }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://resonance:${POSTGRES_PASSWORD:-resonance}@postgres:5432/resonance
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
    expose: ["4000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    profiles: ["app"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5
  web:
    build: { context: ., target: web }
    environment:
      NODE_ENV: production
      API_URL: http://api:4000
    expose: ["3000"]
    depends_on: [api]
    profiles: ["app"]
  gateway:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]
    profiles: ["app"]
volumes:
  postgres-data:
  redis-data:
